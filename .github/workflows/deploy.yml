name: 自動發佈到 GitHub Pages

on:
  push:
    branches:
      - main

# 👇 關鍵新增：直接在這裡發給機器人「寫入/發佈」的權限徽章
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 下載原始碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝工具套件
        run: npm install

      - name: 打包編譯網站
        run: npm run build

      - name: 發佈到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist